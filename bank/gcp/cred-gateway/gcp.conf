# GCP endpoints exposed to the lab container.
# Counterpart to proxy/gcp.py and broker/gcp.js.
#
# This route exists for tooling the proxy cannot mediate — gRPC-based client
# libraries are the known case, and whether they can be injected into at all is
# still open. Everything that speaks proxied HTTP is served by token injection
# in gcp.py instead and never needs to call this.
#
# What it hands over is a real access token, short-lived, for the one service
# account this deployment impersonates. That is the same bargain as
# /github/credential: the agent's authority is exactly the service account's
# IAM roles, no more and no less, and choosing those roles narrowly is the
# deployment's job. The broker refuses to mint for any other service account,
# so a caller cannot widen this by asking differently.

location = /gcp/token {
  limit_req zone=creds burst=5 nodelay;
  proxy_pass http://broker:8080/gcp/token;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_read_timeout 15s;
}
