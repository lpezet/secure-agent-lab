# GCP endpoints exposed to the lab container.
# Counterpart to proxy/gcp.py and broker/gcp.js.
#
# This route hands the lab a token directly, for tooling that wants one locally
# rather than injected in flight. Everything speaking proxied HTTP is served by
# gcp.py instead and never needs to call this.
#
# It was originally justified by gRPC being unmediatable. #48 measured that and
# it is false: mitmproxy intercepts gRPC through CONNECT, and an addon reads and
# rewrites the `authorization` metadata like any other header. The reason that
# survives is the /github/credential one — some tooling genuinely wants a
# credential in hand, and what this hands over is exactly the service account's
# IAM roles either way.
#
# What it hands over is a real access token, short-lived, for the one service
# account this deployment impersonates. That is the same bargain as
# /github/credential: the agent's authority is exactly the service account's
# IAM roles, no more and no less, and choosing those roles narrowly is the
# deployment's job. The broker refuses to mint for any other service account,
# so a caller cannot widen this by asking differently.

location = /gcp/token {
  limit_req zone=creds burst=5 nodelay;
  proxy_pass http://broker:8080/gcp/token;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_read_timeout 15s;
}
