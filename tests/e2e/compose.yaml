# Stack under test for the e2e tier.
#
# Deliberately NOT examples/claude-code/compose.yaml, for one reason that
# matters: that file builds from
#
#   build: https://github.com/lpezet/secure-agent-lab.git#main:stack/broker
#
# so running it would certify whatever is on main, not the tree you are sitting
# on. Every build here is a local path, so e2e tests the code you are about to
# ship.
#
# The provider/addon/gateway content is mounted straight out of
# examples/claude-code/ rather than copied, so this exercises the reference
# implementation the repo actually ships and cannot drift from it.
name: sat-e2e

services:
  broker:
    build: ../../stack/broker
    volumes:
      # Dedicated creds directory — never the one a real agent uses. See README.
      - ${AGENT_CREDS_DIR:?set AGENT_CREDS_DIR (tests/e2e/run.sh does this)}:/secrets:ro
      # Assembled by run.sh from examples/claude-code plus bank/gcp — see the
      # staging block there for why this is not a direct bind of the example.
      - ./.stage/broker:/app/providers:ro
    env_file: .env
    environment:
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      ANTHROPIC_API_KEY_PATH: /secrets/anthropic.key
      ANTHROPIC_AUTH_TOKEN_PATH: /secrets/anthropic-auth.token
      GCP_ADC_PATH: /secrets/gcp-adc.json
    networks: [secure]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  proxy:
    build: ../../stack/proxy
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./.stage/proxy:/addons:ro
      - proxy-certs:/home/mitmproxy/.mitmproxy
    env_file: .env
    environment:
      BROKER_URL: http://broker:8080
      PYTHONUNBUFFERED: "1"
    networks: [secure, lab]
    healthcheck:
      test:
        ["CMD-SHELL", "test -f /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  cred-gateway:
    build: ../../stack/cred-gateway
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./.stage/cred-gateway:/etc/nginx/gateway.d:ro
    networks: [secure, lab]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # Exfiltration target. Reflects the request headers so a test can see exactly
  # what the proxy sent and to whom. `attacker-host` is the name a leak test
  # aims at while claiming to be a vendor in the Host header.
  echo:
    image: nginx:alpine
    volumes:
      - ./echo.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        aliases: [attacker-host]

  lab:
    build: ./lab
    depends_on:
      proxy:
        condition: service_healthy
      cred-gateway:
        condition: service_healthy
      echo:
        condition: service_started
    volumes:
      - proxy-certs:/proxy-certs:ro
    environment:
      HTTP_PROXY: http://proxy:8080
      HTTPS_PROXY: http://proxy:8080
      NO_PROXY: localhost,127.0.0.1,cred-gateway
      NODE_EXTRA_CA_CERTS: /proxy-certs/mitmproxy-ca-cert.pem
      REQUESTS_CA_BUNDLE: /proxy-certs/mitmproxy-ca-cert.pem
      SSL_CERT_FILE: /proxy-certs/mitmproxy-ca-cert.pem
      GIT_CREDENTIAL_URL: http://cred-gateway/github/credential
      GITHUB_IDENTITY_URL: http://cred-gateway/github/identity
      # Dummy values, exactly as a real lab container has them. If a test ever
      # sees a real credential in this container, the boundary has failed.
      ANTHROPIC_API_KEY: proxy-injected
      GH_TOKEN: proxy-injected
      CLOUDSDK_AUTH_ACCESS_TOKEN: proxy-injected
      CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE: /proxy-certs/mitmproxy-ca-cert.pem
      GCP_TOKEN_URL: http://cred-gateway/gcp/token
      E2E_TEST_REPO: ${E2E_TEST_REPO:-}
    # No devcontainer lifecycle here, so hold the container open ourselves.
    command: sleep infinity
    networks: [lab]

networks:
  # secure is NOT internal: broker calls api.github.com and api.cloudflare.com
  # directly, and the proxy reaches every provider through it.
  secure:
    driver: bridge
  # lab IS internal by default: no default gateway, so the only way out is a
  # container on this network — the proxy. That is what makes 001_allowlist.py
  # enforcing rather than advisory; without it, HTTP_PROXY is a request the
  # agent can decline with `curl --noproxy '*'`.
  #
  # Set LAB_INTERNAL=false to opt out. It costs you the boundary: egress
  # becomes unmediated and check-invariants.sh will say so on every run.
  # The reason to do it is tooling that cannot use an HTTP proxy at all —
  # raw sockets, ssh, anything that resolves before proxying. Proxied HTTP
  # and HTTPS are unaffected either way, because the proxy resolves the
  # hostname, not the client.
  lab:
    driver: bridge
    internal: ${LAB_INTERNAL:-true}

volumes:
  proxy-certs:
