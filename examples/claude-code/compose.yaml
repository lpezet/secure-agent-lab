name: claude-code-agent

services:
  broker:
    build: https://github.com/lpezet/secure-agent-lab.git#v1.2.0:stack/broker
    volumes:
      - ${HOME}/.config/agent-creds:/secrets:ro
      - ./broker:/app/providers:ro
    env_file: .env
    environment:
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      ANTHROPIC_API_KEY_PATH: /secrets/anthropic.key
      ANTHROPIC_AUTH_TOKEN_PATH: /secrets/anthropic-auth.token
    networks: [secure]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  proxy:
    build: https://github.com/lpezet/secure-agent-lab.git#v1.2.0:stack/proxy
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./proxy:/addons:ro
      # Egress allowlist (opt-in). Copy 001_allowlist.py from stack/proxy/addons
      # into ./proxy, then uncomment this. Absent file = every destination
      # permitted, so the mount is what turns it on.
      # It lives here rather than in ./proxy because that directory is mounted
      # wholesale as /addons — a non-addon file in it would land there too.
      # - ./allowlist:/etc/agent-allowlist:ro
      - proxy-certs:/home/mitmproxy/.mitmproxy
    environment:
      BROKER_URL: http://broker:8080
    networks: [secure, lab]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  cred-gateway:
    build: https://github.com/lpezet/secure-agent-lab.git#v1.2.0:stack/cred-gateway
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      # Whitelisted endpoints. Host path only — must stay outside whatever
      # is mounted at /workspace in lab, or the agent could widen it.
      - ./cred-gateway:/etc/nginx/gateway.d:ro
    networks: [secure, lab]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  lab:
    build:
      context: ./lab
      args:
        CLAUDE_VERSION: ${CLAUDE_VERSION:-latest}
    depends_on:
      proxy:
        condition: service_healthy
      cred-gateway:
        condition: service_healthy
    volumes:
      - proxy-certs:/proxy-certs:ro
      # These must target the container's HOME, which is /home/agent since the
      # lab image stopped running as root. Mounting them at /root/ leaves them
      # somewhere Claude Code never looks: it reads $HOME, so settings and auth
      # state silently do not survive a container recreate.
      # tests/integration/00-config-lint asserts these against the Dockerfile.
      - ./workspace/.claude:/home/agent/.claude
      - ./workspace/.claude.json:/home/agent/.claude.json
      - ./workspace/.config:/home/agent/.config
      - ./workspace/CLAUDE.md:/home/agent/CLAUDE.md:ro
      # Mount the repo or project Claude Code will work on:
      # - /path/to/your/project:/workspace
    environment:
      HTTP_PROXY: http://proxy:8080
      HTTPS_PROXY: http://proxy:8080
      NO_PROXY: localhost,127.0.0.1,cred-gateway
      NODE_EXTRA_CA_CERTS: /proxy-certs/mitmproxy-ca-cert.pem
      REQUESTS_CA_BUNDLE: /proxy-certs/mitmproxy-ca-cert.pem
      SSL_CERT_FILE: /proxy-certs/mitmproxy-ca-cert.pem
      GIT_CREDENTIAL_URL: http://cred-gateway/github/credential
      GITHUB_IDENTITY_URL: http://cred-gateway/github/identity
      # Dummy values — proxy strips these and injects real credentials
      ANTHROPIC_API_KEY: proxy-injected
      GH_TOKEN: proxy-injected
    networks: [lab]
    restart: unless-stopped

networks:
  # secure is NOT internal: broker calls api.github.com and api.cloudflare.com
  # directly, and the proxy reaches every provider through it.
  secure:
    driver: bridge
  # lab IS internal by default: no default gateway, so the only way out is a
  # container on this network — the proxy. That is what makes 001_allowlist.py
  # enforcing rather than advisory; without it, HTTP_PROXY is a request the
  # agent can decline with `curl --noproxy '*'`.
  #
  # Set LAB_INTERNAL=false to opt out. It costs you the boundary: egress
  # becomes unmediated and check-invariants.sh will say so on every run.
  # The reason to do it is tooling that cannot use an HTTP proxy at all —
  # raw sockets, ssh, anything that resolves before proxying. Proxied HTTP
  # and HTTPS are unaffected either way, because the proxy resolves the
  # hostname, not the client.
  lab:
    driver: bridge
    internal: ${LAB_INTERNAL:-true}

volumes:
  proxy-certs:
